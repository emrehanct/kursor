<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Kursor</title>
<style>
  :root { --bg1:#1B1F4B; --bg2:#4B2A8C; --acc:#FF8A3D; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; }
  body { background: linear-gradient(135deg,var(--bg1),var(--bg2)); color:#fff;
         font-family: "Inter", "Roboto", sans-serif; display:flex; flex-direction:column; align-items:center; }
  header { display:flex; align-items:center; gap:22px; margin-top:64px; }
  header svg { width:84px; height:84px; }
  header h1 { font-size:64px; margin:0; font-weight:800; letter-spacing:-1px; }
  header p { margin:4px 0 0; color:#FFB547; font-size:22px; }
  form { margin-top:44px; width:820px; display:flex; }
  input { flex:1; font-size:26px; padding:18px 24px; border-radius:16px 0 0 16px; border:0; outline:none; }
  input:focus { box-shadow: 0 0 0 4px var(--acc) inset; }
  button { font-size:24px; padding:0 30px; border:0; border-radius:0 16px 16px 0; background:var(--acc); color:#fff; font-weight:700; }
  .grid { margin-top:52px; display:grid; grid-template-columns:repeat(4, 220px); gap:26px; }
  .tile { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px;
          height:150px; border-radius:20px; background:rgba(255,255,255,.08); color:#fff; text-decoration:none;
          font-size:22px; font-weight:600; border:3px solid transparent; transition:transform .12s; }
  .tile:hover { border-color:var(--acc); transform:scale(1.05); background:rgba(255,255,255,.15); }
  .badge { width:58px; height:58px; border-radius:14px; display:flex; align-items:center; justify-content:center;
           font-size:30px; font-weight:800; }
  h2 { margin:48px 0 0; font-size:18px; color:rgba(255,255,255,.6); font-weight:500; letter-spacing:2px; text-transform:uppercase; }
  footer { margin-top:auto; padding:22px; color:rgba(255,255,255,.55); font-size:16px; text-align:center; }
</style>
</head>
<body>
<header>
  <svg viewBox="0 0 512 512" aria-hidden="true">
    <defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB547"/><stop offset="1" stop-color="#FF6A3D"/></linearGradient></defs>
    <path d="M150 104 L150 392 L222 330 L270 430 L322 406 L274 308 L372 300 Z" fill="#fff" stroke="#fff" stroke-width="18" stroke-linejoin="round"/>
    <path d="M188 196 L188 296 L266 246 Z" fill="url(#a)" stroke="url(#a)" stroke-width="10" stroke-linejoin="round"/>
  </svg>
  <div><h1>Kursor</h1><p id="tag">Eğitim videoları için TV tarayıcısı</p></div>
</header>

<form id="f" action="javascript:void 0">
  <input id="q" type="text" autocomplete="off" placeholder="Adres yazın veya arayın">
  <button id="go" type="submit">Git</button>
</form>

<h2 id="h-sites">Eğitim platformları</h2>
<div class="grid">
  <a class="tile" href="https://www.youtube.com/"><span class="badge" style="background:#E53935">Y</span>YouTube</a>
  <a class="tile" href="https://www.udemy.com/home/my-courses/learning/"><span class="badge" style="background:#7E57C2">U</span>Udemy</a>
  <a class="tile" href="https://www.coursera.org/"><span class="badge" style="background:#1E88E5">C</span>Coursera</a>
  <a class="tile" href="https://www.khanacademy.org/"><span class="badge" style="background:#43A047">K</span>Khan Academy</a>
  <a class="tile" href="https://www.btkakademi.gov.tr/"><span class="badge" style="background:#00897B">B</span>BTK Akademi</a>
  <a class="tile" href="https://www.ted.com/talks"><span class="badge" style="background:#D32F2F">T</span>TED</a>
  <a class="tile" href="https://www.edx.org/"><span class="badge" style="background:#00838F">e</span>edX</a>
  <a class="tile" href="https://www.google.com/"><span class="badge" style="background:#546E7A">G</span><span id="t-search">Web'de ara</span></a>
</div>

<footer id="foot">Kursor bağımsız bir tarayıcıdır; açtığınız sitelerle bağlantısı yoktur.</footer>

<script>
  var en = !/^tr/i.test(navigator.language || '');
  if (en) {
    document.documentElement.lang = 'en';
    document.getElementById('tag').textContent = 'The TV browser for learning videos';
    document.getElementById('q').placeholder = 'Type an address or search';
    document.getElementById('go').textContent = 'Go';
    document.getElementById('h-sites').textContent = 'Learning platforms';
    document.getElementById('t-search').textContent = 'Search the web';
    document.getElementById('foot').textContent = 'Kursor is an independent browser and is not affiliated with the sites you open.';
  }
  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    var q = document.getElementById('q').value.trim();
    if (!q) return;
    var url = /^https?:\/\//i.test(q) ? q
      : (/^[^\s]+\.[a-z]{2,}(\/\S*)?$/i.test(q) ? 'https://' + q
      : 'https://www.google.com/search?q=' + encodeURIComponent(q));
    location.href = url;
  });
</script>
</body>
</html>
